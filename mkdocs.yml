site_name: SPHEREx notes for the post-starburst project
site_description: What we have learned about SPHEREx data, its reduction and analysis, and the SED and spectral-index work on nearby SDSS galaxies.
site_url: https://dr-guangtou.github.io/spherex_psb/
repo_url: https://github.com/dr-guangtou/spherex_psb
repo_name: dr-guangtou/spherex_psb
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: false
strict: true

validation:
  anchors: warn
  absolute_links: warn
  unrecognized_links: warn

exclude_docs: |
  references/sources/**
  figures/*.py

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Source Sans 3
    code: Source Code Pro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - SPHEREx primer: primer.md
  - Data access: data_access.md
  - Data reduction and analysis: reduction_analysis.md
  - SED extraction for SDSS galaxies: sed_extraction.md
  - Spectral index measurement: spectral_indices.md
  - Project:
      - Specification: SPEC.md
      - To do: todo.md
      - Lessons: lessons.md
      - Reports:
          - SED demo report: reports/demo_sed_report.md
          - SED demo task: reports/sed_demo_task.md
          - H-minus bump feasibility: reports/hminus_bump_feasibility.md
          - Third-party tool review: reports/spherex_tools_review.md
  - References:
      - Official sources:
          - IRSA SPHEREx pages: references/irsa/irsa_spherex_official_pages.md
          - Explanatory Supplement v2.0: references/irsa/spherex_explanatory_supplement_v2.0.md
          - Archive documentation: references/irsa/spherex_archive_documentation.md
          - IRSA tutorials: references/irsa/irsa_spherex_tutorials.md
      - Papers:
          - Instrument (Korngut et al. 2026): references/papers/paper_instrument_2603.29835.md
          - Pipeline (Akeson et al. 2026): references/papers/paper_pipeline_2511.15823.md
          - Map making (Cukierman et al. 2026): references/papers/paper_mapmaking_2603.25790.md
          - Ultracool dwarfs, SPIFF (Gagne et al. 2026): references/papers/paper_ref_2604.22012.md
          - Cygnus X ices (Hora et al. 2026): references/papers/paper_ref_2603.12390.md
          - Compact SDSS galaxies (Lee et al. 2026): references/papers/paper_ref_2607.18048.md
          - Brown dwarfs (Rustamkulov et al. 2026): references/papers/paper_ref_2607.00543.md
          - Reddened quasars (Stepney et al. 2026): references/papers/paper_ref_2605.06791.md
          - z > 4 quasars (Davies et al. 2026): references/papers/paper_ref_2603.10135.md
      - Studies:
          - Photometry study (2026-11): references/studies/photometry_study_2026-11.md
      - Third-party tools:
          - GitHub survey (2026-09): references/tools/github_survey_2026-09-23.md
          - spherex-retrieval: references/tools/spherex-retrieval.md
          - tractorjax-spherex: references/tools/tractorjax-spherex.md
          - Caltech-IPAC spherex-pipelines: references/tools/Caltech-IPAC_spherex-pipelines.md
          - Caltech-IPAC tractor-spherex: references/tools/Caltech-IPAC_tractor-spherex.md
          - SPHEREx_pipeline: references/tools/SPHEREx_pipeline.md
          - SPHERExSpecPhot: references/tools/SPHERExSpecPhot.md
          - SPIFF: references/tools/SPIFF.md
          - spexpi: references/tools/spexpi.md
          - spherex-cutoutdb: references/tools/spherex-cutoutdb.md
          - spherex-tools: references/tools/spherex-tools.md
          - spherex_spectra: references/tools/spherex_spectra.md
          - spherextract: references/tools/spherextract.md
          - sphx_spec_stack: references/tools/sphx_spec_stack.md
          - spxquery: references/tools/spxquery.md
          - xcavation: references/tools/xcavation.md
