[project]
name = "spherex-psb"
version = "0.1.0"
description = "Nearby post-starburst galaxies with SPHEREx spectrophotometry"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "astroquery>=0.4.11",
    "dust-extinction>=1.7",
    "fsspec[s3]>=2026.9.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.1.1",
    "photutils>=3.0.0",
    "pyarrow>=26.0.1",
    "pyvo>=1.9.1",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "speclite>=1.0.0",
    "spherex-retrieval",
    "tractor-jax",
    "tractorjax-spherex",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spherex_psb"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.2",
    "sphinx>=9.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"
# Verbatim copies of official IRSA tutorial sources are reference material, not our code
extend-exclude = ["docs/references/sources/irsa_tutorial_sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.uv.sources]
spherex-retrieval = { git = "https://github.com/hbahk/spherex-retrieval" }
tractor-jax = { git = "https://github.com/hbahk/tractor-jax" }
tractorjax-spherex = { git = "https://github.com/hbahk/tractorjax-spherex" }
